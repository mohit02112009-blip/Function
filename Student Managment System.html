<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real life Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32%),
                linear-gradient(135deg, #0f172a, #111827 55%, #1e293b);
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            padding: 34px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.22);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 0;
        }

        h2 {
            text-align: center;
            margin-bottom: 18px;
            font-size: 22px;
            font-weight: 700;
            color: #dbeafe;
        }

        .form-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 26px;
            padding: 24px;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .form-box h2 {
            grid-column: 1 / -1;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        button {
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.38);
        }

        button:active {
            transform: translateY(0);
        }

        .form-box button {
            grid-column: 1 / -1;
        }

        .button-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 26px;
        }

        .result-box {
            padding: 24px;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        #result {
            min-height: 110px;
            color: #e0f2fe;
            line-height: 1.6;
        }

        #result p {
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.9);
            border-left: 4px solid #3b82f6;
            color: #e5e7eb;
            word-break: break-word;
        }

        @media (max-width: 760px) {
            body {
                padding: 22px;
                align-items: flex-start;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 28px;
            }

            .form-box,
            .button-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Management System</h1>

        <div class="form-box">
            <h2>Add Student</h2>

            <input type="text" id="studentName" placeholder="Enter student name">
            <input type="text" id="studentCourse" placeholder="Enter course name">
            <input type="number" id="studentFees" placeholder="Enter total fees">
            <input type="number" id="studentPaidFees" placeholder="Enter paid fees">

            <button onclick="addStudent()">Add Student</button>
        </div>

        <div class="button-box">
            <button onclick="showStudents()">Show Student</button>
            <button onclick="calculateBalance()">Calculate Balance</button>
            <button onclick="showPaidFees()">Show Paid Fees</button>
            <button onclick="showTotalFees()">Total Fees</button>
        </div>

        <div class="result-box">
            <h2>Output</h2>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const students = [];

        function addStudent() {
            const name = document.getElementById("studentName").value;
            const course = document.getElementById("studentCourse").value;
            const fees = Number(document.getElementById("studentFees").value);
            const paidFees = Number(document.getElementById("studentPaidFees").value);
            const result = document.getElementById("result");

            if (name.trim() === "" || course.trim() === "" || fees <= 0 || paidFees < 0) {
                result.innerHTML = "Please enter valid student details.";
                return;
            }

            const student = {
                name: name,
                course: course,
                fees: fees,
                paidFees: paidFees,
            };

            students.push(student);

            result.innerHTML = "Student added successfully.";

            document.getElementById("studentName").value = "";
            document.getElementById("studentCourse").value = "";
            document.getElementById("studentFees").value = "";
            document.getElementById("studentPaidFees").value = "";
        }

        const showStudents = () => {
            const result = document.getElementById("result");

            if (students.length === 0) {
                result.innerHTML = "No student found.";
                return;
            }

            const studentList = students.map((student, index) => {
                return `
      <p>
        <b>${index + 1}. ${student.name}</b><br>
        Course: ${student.course}<br>
        Total Fees: ${student.fees}<br>
        Paid Fees: ${student.paidFees}<br>
        Balance: ${student.fees - student.paidFees}
      </p>
    `;
            });

            result.innerHTML = studentList.join("");
        };

        const calculateBalance = () => {
            const result = document.getElementById("result");

            if (students.length === 0) {
                result.innerHTML = "No student found.";
                return;
            }

            const balances = students.map((student) => {
                return `<p>${student.name}'s Balance: ${student.fees - student.paidFees}</p>`;
            });

            result.innerHTML = balances.join("");
        };

        const showPaidFees = () => {
            const result = document.getElementById("result");

            if (students.length === 0) {
                result.innerHTML = "No student found.";
                return;
            }

            const paidFeesList = students.map((student) => {
                return `<p>${student.name}: Paid Fees ${student.paidFees}</p>`;
            });

            result.innerHTML = paidFeesList.join("");
        };

        const showTotalFees = () => {
            const result = document.getElementById("result");

            if (students.length === 0) {
                result.innerHTML = "No student found.";
                return;
               }

            const totalFees = students.reduce((total, student) => {
                return total + student.fees;
            }, 0);

            result.innerHTML = `<p>Total Fees: ${totalFees}</p>`;
        };
    </script>

</body>

</html>
